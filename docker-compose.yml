version: '3.9'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:mem:internshipdb;DB_CLOSE_DELAY=-1
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - ai-service

  ai-service:
    build:
      context: ./ai-service
    ports:
      - "5000:5000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - GROQ_API_URL=${GROQ_API_URL}

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_AI_SERVICE_URL=http://localhost:5000
    depends_on:
      - ai-service
